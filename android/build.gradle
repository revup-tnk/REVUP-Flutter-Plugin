group 'com.tnkfactory.revup.flutter'
version '1.0-SNAPSHOT'

buildscript {
    ext.kotlin_version = '2.1.21'
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.9.3'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url 'https://repository.tnkad.net:8443/repository/android/' }
    }
}

apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

android {
    namespace "com.tnkfactory.revup.flutter"
    compileSdk 36

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        minSdkVersion 21
    }
    lint {
        targetSdk = 36
    }
}

dependencies {
    // api 로 노출해야 한다. RevupFlutterPlugin 이 RevupInitializeListener,
    // RewardedVideoAdListener 등 네이티브 SDK 타입을 public 시그니처에 구현하고 있어,
    // implementation 으로 두면 앱 모듈이 GeneratedPluginRegistrant 를 컴파일할 때
    // "cannot access RevupInitializeListener" 로 빌드가 실패한다.
    api 'com.tnkfactory.revup:revupCore:1.0.2'
    api 'com.tnkfactory.revup:revupAndroid:1.0.2'
    api 'com.tnkfactory.revup:revupLuckyEvent:1.0.2'
}
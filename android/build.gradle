group 'com.tnkfactory.revup.flutter'
version '1.0-SNAPSHOT'

buildscript {
    ext.kotlin_version = '2.3.20'
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:9.1.1'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url 'https://repository.tnkad.net:8443/repository/android/' }
    }
}

// built-in Kotlin (1.2.0~): kotlin-android 를 직접 적용하지 않는다.
// AGP 9 는 Kotlin 컴파일을 내장하고, built-in Kotlin 을 끈 앱(android.builtInKotlin=false)이나
// AGP 8 앱에서는 Flutter Gradle 플러그인(3.44+)이 대신 KGP 를 적용한다.
// 그래서 pubspec 의 최소 Flutter 가 3.44 다.
apply plugin: 'com.android.library'

android {
    namespace "com.tnkfactory.revup.flutter"
    compileSdk 36

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        // 네이티브 SDK 1.0.9 가 minSdk 24 를 요구한다.
        minSdkVersion 24
    }
    lint {
        targetSdk = 36
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}

dependencies {
    // api 로 노출해야 한다. RevupFlutterPlugin 이 RevupInitializeListener,
    // RewardedVideoAdListener 등 네이티브 SDK 타입을 public 시그니처에 구현하고 있어,
    // implementation 으로 두면 앱 모듈이 GeneratedPluginRegistrant 를 컴파일할 때
    // "cannot access RevupInitializeListener" 로 빌드가 실패한다.
    api 'com.tnkfactory.revup:revupCore:1.0.9'
    api 'com.tnkfactory.revup:revupAndroid:1.0.9'
    api 'com.tnkfactory.revup:revupLuckyEvent:1.0.9'
}